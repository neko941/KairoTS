[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kairots"
version = "0.0.7"
description = "A modular federated time-series learning framework"
readme = "README.md"
license = "MIT-0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = ["numpy", "polars", "torch", "ray", "xlrd"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright"]
docs = ["sphinx", "pydata-sphinx-theme", "myst-parser"]
estimators = ["xgboost"]
analysis = ["matplotlib"]
reasoning = ["transformers", "peft", "accelerate"]

[project.scripts]
kairots = "kairots.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p no:platformdirs -p no:cacheprovider"

[tool.ruff]
target-version = "py314"
cache-dir = "tmp/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "N"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"src/kairots/**/[A-Z]*.py" = ["N801", "N999"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
extraPaths = ["src", "tests"]
venvPath = "."
venv = ".conda"
